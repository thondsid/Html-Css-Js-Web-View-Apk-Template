name: Build APK

on:
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          sudo mv gradle-8.7 /opt/gradle
          echo "/opt/gradle/bin" >> $GITHUB_PATH

      - name: Generate Gradle build files
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WebView Apk Template"
          include(":app")
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
          }
          EOF
          mkdir -p app
          cat > app/build.gradle <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.bops6.fieldreport"
              compileSdk = 34

              signingConfigs {
                  release {
                      storeFile file("../fieldreportforbops6.keystore")
                      storePassword = providers.environmentVariable("SIGNSTORE_PASSWORD").getOrNull()
                      keyAlias = providers.environmentVariable("SIGNKEY_ALIAS").getOrNull()
                      keyPassword = providers.environmentVariable("SIGNKEY_PASSWORD").getOrNull()
                  }
              }

              defaultConfig {
                  applicationId = "com.bops6.fieldreport"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled = false
                      signingConfig = signingConfigs.release
                  }
              }

              sourceSets {
                  getByName("main") {
                      manifest.srcFile("../AndroidManifest.xml")
                      java.srcDirs("../src")
                      res.srcDirs("../res")
                      assets.srcDirs("../assets")
                  }
              }
          }
          EOF

      - name: Decode Keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > fieldreportforbops6.keystore

      - name: Patch manifest for Android 12+
        run: |
          sed -i 's/android:minSdkVersion="12"/android:minSdkVersion="24"/' AndroidManifest.xml
          sed -i 's/android:targetSdkVersion="27"/android:targetSdkVersion="34"/' AndroidManifest.xml

      - name: Build APK with Gradle
        run: gradle :app:assembleRelease --stacktrace
        env:
          SIGNSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SIGNKEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNKEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/fieldreportforbops6.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fieldreportforbops6
          path: app/build/outputs/apk/release/fieldreportforbops6.apk
