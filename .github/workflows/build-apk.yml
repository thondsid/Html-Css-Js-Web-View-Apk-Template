name: Build APK

on:
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Decode Keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > fieldreportforbops6.keystore

      - name: Patch manifest for Android 12+
        run: |
          if [ -f AndroidManifest.xml ]; then
            sed -i 's/android:minSdkVersion="12"/android:minSdkVersion="24"/' AndroidManifest.xml || true
            sed -i 's/android:targetSdkVersion="27"/android:targetSdkVersion="34"/' AndroidManifest.xml || true
          fi

      - name: Build Release APK with Signature
        run: gradle :app:assembleRelease
        env:
          SIGNSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SIGNKEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNKEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/fieldreportforbops6.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fieldreportforbops6
          path: app/build/outputs/apk/release/fieldreportforbops6.apk
