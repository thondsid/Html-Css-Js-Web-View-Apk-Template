<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Field Reports</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon.png">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --primary:#2563eb;
  --primary-600:#1d4ed8;
  --text:#0f172a;
  --muted:#64748b;
  --danger:#dc2626;
  --border:#e2e8f0;
  --radius:16px;
  --shadow:0 8px 24px rgba(2,6,23,0.08);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column; position:relative;}
header{
  position:sticky;top:0;z-index:10;
  background:var(--card);
  border-bottom:1px solid var(--border);
  padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;
}
.header-left {display:flex; align-items:center; gap:8px;}
header h1{font-size:16px;margin:0;font-weight:700;display:flex;align-items:center;gap:6px;}
header h1 img{width:20px;height:20px;object-fit:contain;}
.customer{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.menu-btn{background:transparent; border:0; font-size:20px; cursor:pointer; padding:0 4px; color:var(--text);}
.btn{
  appearance:none;border:0;border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;
  background:var(--primary);color:white;cursor:pointer;
}
.btn.secondary{background:#e2e8f0;color:var(--text)}
.btn.danger{background:var(--danger)}
.btn.history-btn{background:#059669;color:white;margin-bottom:10px;width:100%;text-align:center;}
.btn:disabled{opacity:.5;cursor:not-allowed}
main{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px;}
.card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px;border:1px solid var(--border);
}
h2{margin:0 0 12px;font-size:18px}
label{display:block;font-size:13px;margin:12px 0 6px;color:var(--muted);font-weight:600}
input,select,textarea{
  width:100%;padding:12px 12px;border:1px solid var(--border);border-radius:12px;
  font-size:15px;background:#fff;color:var(--text);outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.help{font-size:12px;color:var(--muted);margin-top:4px}
.actions{display:flex;gap:10px;margin-top:18px}
.actions .btn{flex:1}
.review{
  background:#0f172a;color:#e2e8f0;border-radius:12px;padding:12px;font-family:ui-monospace,Menlo,Monaco,Consolas,monospace;
  font-size:13px;white-space:pre-wrap;word-break:break-word;max-height:360px;overflow:auto;
}
.footer{margin-top:auto;padding:16px;text-align:center;color:var(--muted);font-size:12px}
.toggle{display:flex;gap:8px;flex-wrap:wrap}
.toggle button{flex:1;border:1px solid var(--border);background:#fff;padding:10px;border-radius:10px;cursor:pointer;font-size:12px}
.toggle button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.history-container{max-height:480px;overflow-y:auto;padding-right:4px;}
.day-group{
  border:2px solid var(--primary);
  border-radius:14px;
  padding:12px;
  margin-bottom:16px;
  background:#f8fafc;
}
.day-header{
  font-weight:bold;
  color:var(--primary-600);
  font-size:14px;
  margin-bottom:10px;
  padding-bottom:6px;
  border-bottom:1px dashed var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.history-item{
  background:#ffffff;
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  margin-bottom:10px;
  font-size:13px;
  box-shadow:0 2px 6px rgba(0,0,0,0.03);
}
.history-item:last-child{margin-bottom:0;}

/* Sidebar Styles */
.sidebar-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100;
  display: none; opacity: 0; transition: opacity 0.3s;
}
.sidebar-overlay.open { display: block; opacity: 1; }
.sidebar {
  position: fixed; top: 0; left: -280px; width: 280px; height: 100%;
  background: var(--card); z-index: 101; box-shadow: 4px 0 20px rgba(0,0,0,0.1);
  transition: left 0.3s ease; display: flex; flex-direction: column; padding: 20px;
}
.sidebar.open { left: 0; }
.sidebar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; }
.sidebar-header h3 { margin: 0; font-size: 16px; color: var(--text); }
.close-sidebar { background: none; border: 0; font-size: 20px; cursor: pointer; color: var(--muted); }
.sidebar-menu { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; }
.sidebar-item {
  background: #f8fafc; border: 1px solid var(--border); padding: 10px 12px; border-radius: 10px;
  text-align: left; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--text);
  display: flex; align-items: center; gap: 8px; transition: background 0.2s;
}
.sidebar-item:hover { background: #e2e8f0; }
.sidebar-desc { margin-top: 15px; font-size: 12px; color: var(--muted); background: #f1f5f9; padding: 10px; border-radius: 8px; min-height: 60px; }
.search-box-container { margin-bottom: 12px; display: flex; gap: 6px; }
</style>
</head>
<body>
<div id="app">
<header>
  <div class="header-left">
    <button class="menu-btn" id="menuToggleBtn">☰</button>
    <div>
      <h1><img src="icon.png" alt="Logo"> Field Reports</h1>
      <div class="customer" id="customerBadge">No customer</div>
    </div>
  </div>
  <div style="display:flex; gap:6px; align-items:center;" id="headerBtns">
    <button class="btn secondary" id="cancelBtn">Cancel</button>
  </div>
</header>
<main id="main"></main>
<div class="footer">Optimized for Mobile Harness / Web-to-App</div>

<!-- Sidebar Menu -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h3>⚙️ Menu & Tools</h3>
    <button class="close-sidebar" id="closeSidebarBtn">&times;</button>
  </div>
  <div class="sidebar-menu">
    <button class="sidebar-item" id="sbGoogleBackup">☁️ Google Backup / Drive</button>
    <button class="sidebar-item" id="sbSearchCustomer">🔍 Search by Customer Name</button>
    <button class="sidebar-item" id="sbSearchCpe">🔍 Search by CPE</button>
    <button class="sidebar-item" id="sbSearchDate">📅 Search by Date</button>
    <button class="sidebar-item" id="sbExportFile">💾 Export Data to File</button>
    <button class="sidebar-item" id="sbImportFile">📂 Load Data from File</button>
    <input type="file" id="importFileInput" style="display:none" accept=".json"/>
    <div class="sidebar-desc" id="sidebarDesc">Description: (Blank)</div>
  </div>
</div>
</div>

<script>
const $= s => document.querySelector(s); const$$ = s => Array.from(document.querySelectorAll(s));

const APPS_SCRIPT_URL = 'YOUR_APPS_SCRIPT_URL_HERE';

const savedState = localStorage.getItem('field_report_current_state');
const state = savedState ? JSON.parse(savedState) : {
  customerName:'',
  taskType:null,
  poiBefore:{},
  poiAfter:{},
  tktBefore:{},
  tktAfter:{},
  r6Warning:false,
  step:'WELCOME',
  selectedFilterDate: 'ALL',
  searchQuery: '',
  searchType: ''
};

// Check history from localStorage (or act as file/storage mechanism)
state.history = JSON.parse(localStorage.getItem('field_report_history') || '[]');
if(!state.selectedFilterDate) state.selectedFilterDate = 'ALL';

function saveCurrentState() {
  localStorage.setItem('field_report_current_state', JSON.stringify({
    customerName: state.customerName,
    taskType: state.taskType,
    poiBefore: state.poiBefore,
    poiAfter: state.poiAfter,
    tktBefore: state.tktBefore,
    tktAfter: state.tktAfter,
    r6Warning: state.r6Warning,
    step: state.step,
    selectedFilterDate: state.selectedFilterDate,
    searchQuery: state.searchQuery,
    searchType: state.searchType
  }));
}

function render(){
  saveCurrentState();
  const main = $('#main');
  main.innerHTML = '';
  const step = state.step;
  updateCustomerBadge();

  const headerBtns = $('#headerBtns');
  headerBtns.innerHTML = `
    <button class="btn secondary" id="cancelBtn" style="padding:10px 12px; font-size:14px;">Cancel</button>
  `;
  $('#cancelBtn').onclick = cancelTask;

  if(step==='WELCOME') return renderWelcome(main);
  if(step==='CUSTOMER_NAME') return renderCustomer(main);
  if(step==='TASK_TYPE') return renderTaskType(main);
  if(step==='POI_BEFORE_FORM') return renderPoiBeforeForm(main);
  if(step==='POI_BEFORE_REVIEW') return renderPoiBeforeReview(main);
  if(step==='POI_AFTER_FORM') return renderPoiAfterForm(main);
  if(step==='POI_AFTER_REVIEW') return renderPoiAfterReview(main);
  if(step==='TKT_BEFORE_FORM') return renderTktBeforeForm(main);
  if(step==='TKT_BEFORE_REVIEW') return renderTktBeforeReview(main);
  if(step==='TKT_AFTER_FORM') return renderTktAfterForm(main);
  if(step==='TKT_AFTER_REVIEW') return renderTktAfterReview(main);
  if(step==='R6_CHECK') return renderR6Check(main);
  if(step==='HISTORY') return renderHistory(main);
  if(step==='SEARCH_RESULT') return renderSearchResult(main);
}

function updateCustomerBadge(){
  // Only show customer badge if actively working on a task (not in welcome or history or review idle)
  const activeSteps = ['CUSTOMER_NAME', 'TASK_TYPE', 'POI_BEFORE_FORM', 'POI_BEFORE_REVIEW', 'POI_AFTER_FORM', 'POI_AFTER_REVIEW', 'TKT_BEFORE_FORM', 'TKT_BEFORE_REVIEW', 'TKT_AFTER_FORM', 'TKT_AFTER_REVIEW', 'R6_CHECK'];
  if(activeSteps.includes(state.step) && state.customerName) {
    $('#customerBadgetextContent' || 'customerBadge').textContent = `Customer: ${state.customerName}`;
  } else {
    $('#customerBadge').textContent = 'No customer';
  }
}

function cancelTask(){
  localStorage.removeItem('field_report_current_state');
  Object.assign(state,{
    customerName:'',
    taskType:null,
    poiBefore:{},
    poiAfter:{},
    tktBefore:{},
    tktAfter:{},
    r6Warning:false,
    step:'WELCOME',
    editingHistoryIndex: undefined,
    selectedFilterDate: 'ALL',
    searchQuery: '',
    searchType: ''
  });
  updateCustomerBadge();
  render();
}

function renderWelcome(main){
  const card = cardEl('Welcome','Start a new field work report');
  card.innerHTML += `
    <button class="btn history-btn" id="viewHistoryBtn">📋 ပြီးခဲ့သော Task မှတ်တမ်းများ ကြည့်ရန်</button>
    <div class="actions"><button class="btn" id="startBtn">Start New Task</button></div>
  `;
  main.appendChild(card);
  $('#startBtn').onclick = ()=>{state.step='CUSTOMER_NAME'; render();};
  $('#viewHistoryBtn').onclick = ()=>{state.step='HISTORY'; render();};
}

function renderHistory(main){
  const card = cardEl('Task History', 'နေ့ရက်အလိုက် ခွဲခြားထားသော မှတ်တမ်းများ (Edit ပြុလုပ်နိုင်သည်)');
  let content = '';

  let filteredHistory = state.history;
  if(state.selectedFilterDate && state.selectedFilterDate !== 'ALL') {
    filteredHistory = state.history.filter(h => (h.dateOnly || h.date.split(',')[0]) === state.selectedFilterDate);
  }

  // Dates list for filter dropdown inside history card if needed
  const dates = Array.from(new Set(state.history.map(h => h.dateOnly || h.date.split(',')[0]))).filter(Boolean);

  content += `
    <div class="search-box-container">
      <select id="historyDateSelect" style="flex:1;">
        <option value="ALL">📅 Show All Dates</option>
        ${dates.map(d=>`<option value="${d}" ${state.selectedFilterDate===d?'selected':''}>${d}</option>`).join('')}
      </select>
    </div>
  `;

  if(filteredHistory.length === 0) {
    content += '<p class="help">မှတ်တမ်း မရှိသေးပါ။</p>';
  } else {
    const groups = {};
    filteredHistory.forEach(h => {
      const d = h.dateOnly || h.date.split(',')[0] || 'Unknown Date';
      if(!groups[d]) groups[d] = [];
      groups[d].push(h);
    });

    content += '<div class="history-container">';
    Object.keys(groups).forEach(dateStr => {
      content += `
        <div class="day-group">
          <div class="day-header">
            <span>📅 ${dateStr}</span>
            <span>(${groups[dateStr].length} tasks)</span>
          </div>
      `;
      
      groups[dateStr].forEach((h) => {
        const originalIndex = state.history.indexOf(h);
        content += `
          <div class="history-item">
            <strong># [${h.type}] - ${h.customer}</strong><br/>
            <small class="help">🕒 ${h.timeOnly || h.date}</small><br/><br/>
            <strong>--- BEFORE ---</strong>
            <pre style="margin:5px 0; font-family:monospace; font-size:11px; white-space:pre-wrap;">${escapeHtml(h.beforeSummary)}</pre>
            <br/>
            <strong>--- AFTER ---</strong>
            <pre style="margin:5px 0; font-family:monospace; font-size:11px; white-space:pre-wrap;">${escapeHtml(h.afterSummary)}</pre>
            <div style="margin-top:10px;">
              <button class="btn secondary" style="width:100%; font-size:13px; padding:6px;" onclick="editHistoryItem(${originalIndex})">✏️ ဤမှတ်တမ်းကို ပြင်ဆင်မည် (Edit)</button>
            </div>
          </div>
        `;
      });
      content += `</div>`;
    });
    content += '</div>';
  }

  card.innerHTML += content;
  main.appendChild(card);

  const actionCard = document.createElement('div');
  actionCard.className = 'card';
  actionCard.style.padding = '12px 16px';
  actionCard.innerHTML = `
    <div class="actions" style="margin-top:0;">
      <button class="btn secondary" id="historyBottomBackBtn" style="width:100%;">Back</button>
    </div>
  `;
  main.appendChild(actionCard);

  $('#historyBottomBackBtn').onclick = ()=>{ state.step = 'WELCOME'; render(); };
  
  const hDateSelect = $('#historyDateSelect');
  if(hDateSelect) {
    hDateSelect.onchange = (e) => {
      state.selectedFilterDate = e.target.value;
      render();
    };
  }
}

function renderSearchResult(main){
  const card = cardEl(`Search Result (${state.searchType})`, `Keyword: "${state.searchQuery}"`);
  let results = [];
  
  if(state.searchType === 'Customer') {
    results = state.history.filter(h => h.customer.toLowerCase().includes(state.searchQuery.toLowerCase()));
  } else if(state.searchType === 'CPE') {
    results = state.history.filter(h => {
      const bText = (h.rawPoiBefore?.cpe || '') + (h.rawPoiAfter?.new_cpe || '') + (h.rawTktBefore?.new_sn || '');
      return bText.toLowerCase().includes(state.searchQuery.toLowerCase());
    });
  } else if(state.searchType === 'Date') {
    results = state.history.filter(h => (h.dateOnly || '').includes(state.searchQuery));
  }

  let content = '';
  if(results.length === 0) {
    content = '<p class="help">ရှာမတွေ့ပါ။</p>';
  } else {
    content += '<div class="history-container">';
    results.forEach(h => {
      const originalIndex = state.history.indexOf(h);
      content += `
        <div class="history-item">
          <strong># [${h.type}] - ${h.customer}</strong><br/>
          <small class="help">🕒 ${h.date}</small><br/><br/>
          <strong>--- BEFORE ---</strong>
          <pre style="margin:5px 0; font-family:monospace; font-size:11px; white-space:pre-wrap;">${escapeHtml(h.beforeSummary)}</pre>
          <br/>
          <strong>--- AFTER ---</strong>
          <pre style="margin:5px 0; font-family:monospace; font-size:11px; white-space:pre-wrap;">${escapeHtml(h.afterSummary)}</pre>
          <div style="margin-top:10px;">
            <button class="btn secondary" style="width:100%; font-size:13px; padding:6px;" onclick="editHistoryItem(${originalIndex})">✏️ ပြင်ဆင်မည် (Edit)</button>
          </div>
        </div>
      `;
    });
    content += '</div>';
  }

  card.innerHTML += content;
  main.appendChild(card);

  const actionCard = document.createElement('div');
  actionCard.className = 'card';
  actionCard.style.padding = '12px 16px';
  actionCard.innerHTML = `
    <div class="actions" style="margin-top:0;">
      <button class="btn secondary" id="searchBackBtn" style="width:100%;">Back to Welcome</button>
    </div>
  `;
  main.appendChild(actionCard);
  $('#searchBackBtn').onclick = ()=>{ state.step = 'WELCOME'; render(); };
}

function editHistoryItem(idx) {
  const h = state.history[idx];
  if(!h) return;
  state.customerName = h.customer;
  state.taskType = h.type;
  state.editingHistoryIndex = idx;
  
  if(h.rawPoiBefore) state.poiBefore = {...h.rawPoiBefore};
  if(h.rawPoiAfter) state.poiAfter = {...h.rawPoiAfter};
  if(h.rawTktBefore) state.tktBefore = {...h.rawTktBefore};
  if(h.rawTktAfter) state.tktAfter = {...h.rawTktAfter};

  if(h.type === 'POI') {
    state.step = 'POI_AFTER_FORM';
  } else {
    state.step = 'TKT_AFTER_FORM';
  }
  render();
}

function renderCustomer(main){
  const card = cardEl('Customer Name','Enter customer name to begin');
  card.innerHTML += `
    <label>Customer Name</label>
    <input id="custInput" value="${escapeAttr(state.customerName)}" placeholder="e.g. ACME Corp" />
    <div class="actions">
      <button class="btn secondary" id="backBtn">Back</button>
      <button class="btn" id="nextBtn">Next</button>
    </div>`;
  main.appendChild(card);
  $('#nextBtn').onclick = ()=>{
    const val = $('#custInput').value.trim();
    if(!val){alert('Please enter customer name');return;}
    state.customerName = val;
    state.step='TASK_TYPE'; render();
  };
  $('#backBtn').onclick = ()=>{state.step='WELCOME'; render();};
}

function renderTaskType(main){
  const card = cardEl('Select Task Type','Choose POI or TKT');
  card.innerHTML += `
    <div class="row">
      <button class="btn" id="poiBtn">POI</button>
      <button class="btn secondary" id="tktBtn">TKT</button>
    </div>
    <div class="actions"><button class="btn secondary" id="backBtn">Back</button></div>`;
  main.appendChild(card);
  $('#poiBtn').onclick = ()=>{state.taskType='POI'; state.step='POI_BEFORE_FORM'; render();};
  $('#tktBtn').onclick = ()=>{state.taskType='TKT'; state.step='TKT_BEFORE_FORM'; render();};
  $('#backBtn').onclick = ()=>{state.step='CUSTOMER_NAME'; render();};
}

function cardEl(title,sub){
  const d = document.createElement('div');
  d.className='card';
  d.innerHTML = `<h2>${title}</h2><div class="help">${sub||''}</div>`;
  return d;
}

function requiredInputs(form, fields){
  return fields.every(f=>!!(form[f]||'').toString().trim());
}

function isNumeric(v){
  return /^[-+]?\d+(\.\d+)?$/.test(String(v).trim());
}

function computeTotal(start,end){
  const s=parseFloat(start), e=parseFloat(end);
  if(isNaN(s)||isNaN(e)) return '';
  return Math.abs(e-s);
}

function collectData(keys, targetObj){
  keys.forEach(k=>{
    const el = $('#'+k);
    if(el) targetObj[k] = el.value.trim();
  });
}

/* POI Forms and Reviews */
const poiBeforeFields = ['poi_num','cus_lat','box_lat','box_name','plan','cpe','sn'];

function renderPoiBeforeForm(main){
  const data = state.poiBefore;
  const card = cardEl('POI - BEFORE','Fill details before work');
  card.innerHTML += fields([
    {k:'poi_num',label:'POI Number', def: data.poi_num || ''},
    {k:'cus_lat',label:'Customer Lat/Long', def: data.cus_lat || ''},
    {k:'box_lat',label:'Box Lat/Long', def: data.box_lat || ''},
    {k:'box_name',label:'Box Name', def: data.box_name || ''},
    {k:'plan',label:'Plan', def: data.plan || ''},
    {k:'cpe',label:'CPE', def: data.cpe || ''},
    {k:'sn',label:'SN', def: data.sn || ''},
  ]);
  card.innerHTML += `<div class="actions"><button class="btn secondary" id="backBtn">Back</button><button class="btn" id="nextBtn">Review</button></div>`;
  main.appendChild(card);
  
  $('#nextBtn').onclick = ()=>{
    collectData(poiBeforeFields, data);
    if(!requiredInputs(data, poiBeforeFields)){alert('All fields required');return;}
    state.step='POI_BEFORE_REVIEW'; render();
  };
  $('#backBtn').onclick = ()=>{state.step='TASK_TYPE'; render();};
}

function renderPoiBeforeReview(main){
  const d = state.poiBefore;
  const out = formatPoiBefore(d);
  const card = cardEl('POI BEFORE Review',`Customer: ${state.customerName}`);
  card.innerHTML += `<div class="review">${escapeHtml(out)}</div>`;
  card.innerHTML += `<div class="actions"><button class="btn secondary" id="backBtn">Back</button><button class="btn secondary" id="copyBtn">Copy Text</button><button class="btn" id="nextBtn">Continue to AFTER</button></div>`;
  main.appendChild(card);
  $('#copyBtn').onclick = ()=>copy(out);
  $('#backBtn').onclick = ()=>{state.step='POI_BEFORE_FORM'; render();};
  $('#nextBtn').onclick = ()=>{state.step='POI_AFTER_FORM'; render();};
}

function formatPoiBefore(d){
  return `Before
${d.poi_num||''}
Cus lat - ${d.cus_lat||''}
Box Lat- ${d.box_lat||''}
Box name - ${d.box_name||''}
Plan- ${d.plan||''}
CPE- ${d.cpe||''}
SN- ${d.sn||''}
Remark- Let me start`;
}

const poiAfterFields = ['cus_lat','box_lat','box_name','plan','old_cpe','old_sn','new_cpe','new_sn','ssid','password','acc_card'];

function renderPoiAfterForm(main){
  const data = state.poiAfter;
  if(!data.root_cause) data.root_cause = 'Installation';
  if(!data.soc_type) data.soc_type = 'SOC';

  const beforeCpe = state.poiBefore.cpe || '';

function saveToHistory(type, beforeSummary, afterSummary){
  const now = new Date();
  const dateOnly = now.toLocaleDateString();
  const timeOnly = now.toLocaleTimeString();

  const record = {
    type: type,
    customer: state.customerName,
    date: now.toLocaleString(),
    dateOnly: dateOnly,
    timeOnly: timeOnly,
    beforeSummary: beforeSummary,
    afterSummary: afterSummary,
    rawPoiBefore: {...state.poiBefore},
    rawPoiAfter: {...state.poiAfter},
    rawTktBefore: {...state.tktBefore},
    rawTktAfter: {...state.tktAfter},
    summary: `--- BEFORE ---\n${beforeSummary}\n\n--- AFTER ---\n${afterSummary}`
  };
  
  if(state.editingHistoryIndex !== undefined && state.history[state.editingHistoryIndex]) {
    state.history[state.editingHistoryIndex] = record;
    state.editingHistoryIndex = undefined;
  } else {
    state.history.unshift(record);
  }

  localStorage.setItem('field_report_history', JSON.stringify(state.history));
  state.latestRecord = record;
}

function renderR6Check(main){

    };

function backupToGoogleDrive(){
  if(APPS_SCRIPT_URL === 'YOUR_APPS_SCRIPT_URL_HERE'){
    completeTask();
    return;
  }
  
  const payload = state.latestRecord || state.history[0] || { type: state.taskType, customer: state.customerName, date: new Date().toLocaleString(), summary: 'Completed' };

  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(()=>{
    alert('Google Drive သို့ Backup အောင်မြင်စွာ တင်ပြီးပါပြီ။');
    completeTask();
  }).catch(err=>{
    console.error(err);
    alert('အင်တာနက်လိုင်း မကောင်းပါ သို့မဟုတ် Drive သို့ ပို့၍မရပါ။ သို့သော် ဖုန်းထဲတွင် မှတ်တမ်း (History) အောင်မြင်စွာ သိမ်းဆည်းပြီးပါပြီ။');
    completeTask();
  });
}

function completeTask(){
  localStorage.removeItem('field_report_current_state');
  alert('Task completed. You can start a new task.');
  cancelTask();
}

  if(query) {
    state.searchQuery = query.trim();
    state.searchType = 'Customer';
    state.step = 'SEARCH_RESULT';
    render();
  }
};

$('#sbExportFile').onclick = () => {
  toggleSidebar(false);
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state.history, null, 2));
  const downloadAnchor = document.createElement('a');
  downloadAnchor.setAttribute("href", dataStr);
  downloadAnchor.setAttribute("download", `field_reports_backup_${new Date().toISOString().slice(0,10)}.json`);
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  downloadAnchor.remove();
  alert('ဖိုင်အဖြစ် အောင်မြင်စွာ သိမ်းဆည်းပြီးပါပြီ (Export Successful)');
};

$('#sbImportFile').onclick = () => {
  toggleSidebar(false);
  $('#importFileInput').click();
};

$('#importFileInput').onchange = (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    try {
      const imported = JSON.parse(event.target.result);
      if(Array.isArray(imported)) {
        state.history = imported;
        localStorage.setItem('field_report_history', JSON.stringify(state.history));
        alert('ဖိုင်ထဲမှ အချက်အလက်များကို အောင်မြင်စွာ တင်ပြီးပါပြီ (Import Successful)');
        render();
      } else {
        alert('ဖိုင်ပုံစံ မှားယွင်းနေပါသည်။');
      }
    } catch(err) {
      alert('JSON ဖိုင်ကို ဖတ်၍မရပါ။');
    }
  };
  reader.readAsText(file);
};

/* Helpers */
function fields(defs){
  return defs.map(f=>{
    return `<label>${f.label}</label><input id="${f.k}" value="${escapeAttr(f.def||'')}" placeholder="${f.label}"/>`;
  }).join('');
}
function initToggle(id, onSelect){
  const container = $('#'+id);
  if(!container) return;
  container.querySelectorAll('button').forEach(btn=>{
    btn.onclick = ()=>{
      container.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      onSelect(btn.dataset.val);
    };
  });
}
function copy(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>alert('Copied to clipboard'));
  } else {
    const ta = document.createElement('textarea');
    ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    alert('Copied to clipboard');
  }
}
function escapeHtml(s){return String(s).replace(/[&<>/"]/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','/':'&#x2F;','"':'&quot;' }[c]));}
function escapeAttr(s){return String(s).replace(/"/g,'&quot;');}

updateCustomerBadge();
render();
</script>
